<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Data and AI Product Engineering banner">
  <title>Data and AI Product Engineering</title>
  <style>
    .bg { fill: #0b1020; }
    .panel { fill: #111827; stroke: #2b374f; stroke-width: 1; }
    .bar { fill: #182233; }
    .dot { fill: #f87171; }
    .dot2 { fill: #fbbf24; }
    .dot3 { fill: #34d399; }
    .label { fill: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 16px; font-weight: 600; }
    .title { fill: #7dd3fc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 46px; font-weight: 700; }
    .subtitle { fill: #cbd5e1; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 20px; }
    .code { fill: #67e8f9; font-family: 'Consolas', 'SFMono-Regular', monospace; font-size: 18px; }
    .muted { fill: #94a3b8; }
    .flow { stroke: #7dd3fc; stroke-width: 2.5; fill: none; opacity: 0.9; }
    .flow2 { stroke: #34d399; stroke-width: 2.5; fill: none; opacity: 0.8; }
    .node { fill: #12213a; stroke: #38bdf8; stroke-width: 1.5; }
    .node2 { fill: #122f2b; stroke: #34d399; stroke-width: 1.5; }
    .node3 { fill: #2b1f40; stroke: #c084fc; stroke-width: 1.5; }
    .node4 { fill: #2b1b1b; stroke: #f87171; stroke-width: 1.5; }
    .nodeText { fill: #dbeafe; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 13px; font-weight: 600; }
  </style>

  <rect class="bg" width="1200" height="320" rx="20"/>

  <rect class="panel" x="24" y="20" width="1152" height="280" rx="18"/>
  <rect class="bar" x="24" y="20" width="1152" height="42" rx="18"/>

  <circle class="dot" cx="52" cy="41" r="6"/>
  <circle class="dot2" cx="74" cy="41" r="6"/>
  <circle class="dot3" cx="96" cy="41" r="6"/>

  <text class="label" x="120" y="47">Data &amp; AI Product Engineering</text>

  <g>
    <text class="title" x="80" y="136">Data &amp; AI</text>
    <text class="title" x="80" y="185">Product Engineering</text>
    <text class="subtitle" x="82" y="220">ingest • load • transform • test • orchestrate • serve</text>

    <text class="code" x="800" y="108">$ pipeline</text>
    <text class="muted" x="820" y="136">source → warehouse → models → tests → orchestration → insights</text>

    <path class="flow" d="M 780 120 L 930 120"/>
    <path class="flow2" d="M 930 120 L 1060 120"/>
    <path class="flow" d="M 780 170 L 930 170"/>
    <path class="flow2" d="M 930 170 L 1060 170"/>

    <rect class="node" x="720" y="94" width="90" height="42" rx="8"/>
    <rect class="node2" x="900" y="94" width="90" height="42" rx="8"/>
    <rect class="node3" x="1080" y="94" width="90" height="42" rx="8"/>

    <rect class="node" x="720" y="144" width="90" height="42" rx="8"/>
    <rect class="node2" x="900" y="144" width="90" height="42" rx="8"/>
    <rect class="node4" x="1080" y="144" width="90" height="42" rx="8"/>

    <text class="nodeText" x="755" y="120">ingest</text>
    <text class="nodeText" x="937" y="120">transform</text>
    <text class="nodeText" x="1108" y="120">serve</text>

    <text class="nodeText" x="754" y="170">load</text>
    <text class="nodeText" x="941" y="170">test</text>
    <text class="nodeText" x="1095" y="170">orchestrate</text>
  </g>
</svg>
